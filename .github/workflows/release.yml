name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ubuntu-deb:
    name: Build Ubuntu .deb
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.12-venv dpkg-dev ca-certificates

      - name: Read project version
        id: version
        run: |
          version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: github.event_name == 'push'
        run: |
          expected="v${{ steps.version.outputs.version }}"
          actual="${GITHUB_REF_NAME}"
          if [ "$actual" != "$expected" ]; then
            echo "Tag $actual does not match pyproject.toml version $expected" >&2
            exit 1
          fi

      - name: Build Debian package
        run: ./packaging/ubuntu/build-deb.sh

      - name: Add stable release asset name
        run: |
          version="${{ steps.version.outputs.version }}"
          cp "dist/ubuntu/docpull_${version}_amd64.deb" "dist/ubuntu/docpull_amd64.deb"

      - name: Publish release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          assets=(
            "dist/ubuntu/docpull_${{ steps.version.outputs.version }}_amd64.deb"
            "dist/ubuntu/docpull_amd64.deb"
          )

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --title "$TAG_NAME" \
              --notes "Release $TAG_NAME"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-deb
          path: dist/ubuntu/*.deb

  homebrew-formula:
    name: Update Homebrew formula
    runs-on: ubuntu-24.04
    if: github.event_name == 'push'

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read project version
        id: version
        run: |
          version="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        run: |
          expected="v${{ steps.version.outputs.version }}"
          actual="${GITHUB_REF_NAME}"
          if [ "$actual" != "$expected" ]; then
            echo "Tag $actual does not match pyproject.toml version $expected" >&2
            exit 1
          fi

      - name: Compute release tarball SHA
        id: tarball
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha256="$(curl -fsSL "$url" | sha256sum | awk '{print $1}')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          formula = Path("Formula/docpull.rb")
          text = formula.read_text()
          text = re.sub(
              r'url "https://github\.com/[^"]+/archive/refs/tags/v[^"]+\.tar\.gz"',
              f'url "{os.environ["TARBALL_URL"]}"',
              text,
              count=1,
          )
          text = re.sub(
              r'sha256 "[0-9a-f]{64}"',
              f'sha256 "{os.environ["TARBALL_SHA256"]}"',
              text,
              count=1,
          )
          formula.write_text(text)
          PY
        env:
          TARBALL_URL: ${{ steps.tarball.outputs.url }}
          TARBALL_SHA256: ${{ steps.tarball.outputs.sha256 }}

      - name: Commit formula update
        run: |
          if git diff --quiet -- Formula/docpull.rb; then
            echo "Formula already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/docpull.rb
          git commit -m "chore: update formula for ${GITHUB_REF_NAME}"
          git push origin main
